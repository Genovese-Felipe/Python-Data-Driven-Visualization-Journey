name: Publish dashboard portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: true

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source HTML
        shell: bash
        run: |
          set -euo pipefail
          for page in principal dashboard_v1 dashboard_v2 dashboard_v3; do
            test -s "index/${page}.html"
          done
          grep -q "dashboard_v1.html" index/principal.html
          grep -q "dashboard_v2.html" index/principal.html
          grep -q "dashboard_v3.html" index/principal.html
      - name: Check CSV / JSON / HTML parity
        run: python tools/validate_site.py
      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/legacy _site/data
          cp index/*.html _site/legacy/
          cp index/principal.html _site/legacy/index.html
          cp index.html _site/index.html
          cp data/*.json _site/data/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: static-pages-preview
          path: _site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-pages-preview
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
