name: Pages — gated static dashboards
on:
  push:
    branches: [main]
    paths:
      - 'index/**'
      - 'dashboards/**'
      - 'scripts/verify_baseline.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify data integrity before release
        run: python scripts/verify_baseline.py
      - name: Assemble static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index/principal.html _site/index.html
          cp index/dashboard_v1.html index/dashboard_v2.html index/dashboard_v3.html _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/dashboard_v1.html
          test -s _site/dashboard_v2.html
          test -s _site/dashboard_v3.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
