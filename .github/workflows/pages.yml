name: Publish FGen unified VizLab portfolio

on:
  pull_request:
    paths: ["vizlab/**", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["vizlab/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vizlab/requirements.txt
      - name: Install deterministic plotting dependencies
        run: python -m pip install -r vizlab/requirements.txt
      - name: Validate independent source datasets
        run: python vizlab/build.py validate
      - name: Export static HTML and documented JSON API
        run: python vizlab/build.py build
      - name: Verify page artifacts
        run: |
          test -s vizlab/site/index.html
          for f in dashboard_v1 dashboard_v2 dashboard_v3 dashboard_v4 learning_map; do
            test -s "vizlab/site/${f}.html"
          done
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('vizlab/site').glob('*.html'):
              if re.search(r'<script[^>]+src=["\x27]https?://',p.read_text(),re.I):
                  raise SystemExit('External JS dependency: '+str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vizlab-pr-preview
          path: vizlab/site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: vizlab/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
