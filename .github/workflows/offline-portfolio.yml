name: Offline portfolio integrity
on:
  push:
    branches: [main, 'audit/offline-pages-2026-10-19']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check standalone HTMLs and input counts
        run: python tools/validate_portfolio.py
